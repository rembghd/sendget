# SadSha Share — RELEASE App Bundle for Google Play.
#
# Manual dispatch ONLY. Needs Qasim's release keystore in GitHub secrets:
#   ANDROID_KEYSTORE_BASE64 - base64 of his release keystore file
#   KEYSTORE_PASSWORD       - keystore password
#   KEY_ALIAS               - key alias
#   KEY_PASSWORD            - key password
# Secrets do NOT exist yet — this workflow is prepared but NOT verified
# end-to-end until the keystore is added.
#
# How to use:
#   1. Add the 4 secrets above (Settings -> Secrets and variables -> Actions).
#   2. Actions tab -> "Build release AAB" -> Run workflow.
#   3. The AAB is in the run's Artifacts as "sadsha-share-release-aab".

name: Build release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      # Flutter is pinned to 3.41.9 in .fvmrc (do NOT use channel: stable).
      - name: Set up Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      # The app's Rust core is built by cargokit during the Flutter build.
      # Toolchain is pinned in rust-toolchain.toml (1.97.1).
      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/android/release.keystore
          cat > app/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Flutter pub get (workspace)
        run: flutter pub get

      # cargokit/build_tool is not a pub-workspace member; it needs its own
      # pub get (see repo AGENTS.md).
      - name: Pub get for cargokit build tool
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release AAB
        working-directory: app
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: sadsha-share-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
