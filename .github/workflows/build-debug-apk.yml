# SadSha Share — one-click TEST APK build.
#
# How to use:
#   1. Open the repo on GitHub -> Actions tab -> "Build debug APK".
#   2. Click "Run workflow" (or just push to sadsha-remix).
#   3. Wait ~15-25 min. The APK is in the run's Artifacts as
#      "sadsha-share-debug-apk".
# The APK is a DEBUG build (Flutter debug signing, no keystore needed).
# Real releases go through build-release-aab.yml with Qasim's keystore.

name: Build debug APK

on:
  push:
    branches: [sadsha-remix]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # The ubuntu runner already ships a full Android SDK. Do NOT use
      # android-actions/setup-android here: its built-in license-accept
      # step runs `sdkmanager --licenses` without piped input and fails
      # with exit code 1. Pipe `yes` ourselves instead.
      # NDK 28.2.13676358 is the version pinned by Flutter stable
      # (flutter_tools gradle_utils.dart: `const ndkVersion`).
      - name: Set up Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # NOTE: $GITHUB_PATH only applies to LATER steps, so use the full
          # sdkmanager path in this step.
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"

      # Flutter is pinned to 3.41.9 in .fvmrc (do NOT use channel: stable).
      - name: Set up Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      # The app's Rust core is built by cargokit during the Flutter build.
      # Toolchain is pinned in rust-toolchain.toml (1.97.1).
      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Flutter pub get (workspace)
        run: flutter pub get

      # cargokit/build_tool is not a pub-workspace member; it needs its own
      # pub get (see repo AGENTS.md).
      - name: Pub get for cargokit build tool
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sadsha-share-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
