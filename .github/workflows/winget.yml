name: Publish to WinGet
on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish SendGet
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: SadSha.SendGet
          installers-regex: 'SendGet-(?!CLI-).*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Publish SendGet CLI
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: SadSha.SendGet.CLI
          installers-regex: 'SendGet-CLI-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
